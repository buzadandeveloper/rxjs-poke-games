pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,jsx,json,css,md}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{ts,tsx}"
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    tsc:
      glob: 'src/**/*.{ts,tsx}'
      run: bunx typecheck
    madge:
      glob: "src/**/*.{ts,tsx}"
      run: bunx check-circular

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
